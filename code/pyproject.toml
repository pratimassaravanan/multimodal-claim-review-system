[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-claim-review"
version = "0.1.0"
description = "Multi-modal evidence review system — contracts and ontology (P0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["contracts*", "ontology*", "rules*", "providers*", "orchestration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
